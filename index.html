<!DOCTYPE html>
<html lang="en" data-theme="graph">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MathQuest — a game-based study app for NSW HSC Mathematics Advanced and Extension 1.">
<meta name="color-scheme" content="dark light">
<title>MathQuest — HSC Mathematics</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f1c">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">

<!-- iOS ignores the manifest for home-screen installs, so it needs its own tags. -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MathQuest">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="fx-canvas" aria-hidden="true"></canvas>

<div id="boot" class="boot">
  <div class="boot-glyph">∫</div>
  <div class="boot-title">MathQuest</div>
  <div class="boot-sub">Evaluating…</div>
</div>

<header id="topbar" class="topbar" hidden>
  <button class="avatar-btn" id="avatar-btn" title="Your profile">
    <span class="avatar-ring"><span id="avatar-emoji">🧮</span></span>
  </button>

  <div class="topbar-mid">
    <div class="lvl-line">
      <span class="lvl-badge" id="lvl-badge">Lv 1</span>
      <span class="lvl-title" id="lvl-title">Number Line Walker</span>
      <span class="lvl-xp" id="lvl-xp">0 / 130 XP</span>
    </div>
    <div class="xpbar"><div class="xpbar-fill" id="xpbar-fill"></div></div>
  </div>

  <div class="topbar-right">
    <div class="pill pill-streak" id="streak-pill" title="Daily streak">
      <span class="pill-icon">🔥</span><span id="streak-count">0</span>
    </div>
    <div class="pill pill-coin" id="coin-pill" title="Primes — spend them in the Shop">
      <span class="pill-icon">🔢</span><span id="coin-count">0</span>
    </div>
    <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav id="navbar" class="navbar" hidden>
  <a class="nav-item" href="#/home"      data-nav="home"><span class="nav-ico">🏠</span><span>Home</span></a>
  <a class="nav-item" href="#/play"      data-nav="play"><span class="nav-ico">🎮</span><span>Play</span></a>
  <a class="nav-item" href="#/study"     data-nav="study"><span class="nav-ico">🗂️</span><span>Study</span></a>
  <a class="nav-item" href="#/progress"  data-nav="progress"><span class="nav-ico">📈</span><span>Progress</span></a>
  <a class="nav-item" href="#/shop"      data-nav="shop"><span class="nav-ico">🛒</span><span>Shop</span></a>
</nav>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root" class="modal-root" hidden></div>

<!-- ═══════════════════════════════════════════════════════════════
     Classic script tags in dependency order. The script order IS the
     dependency graph. Not ES modules: those are blocked by CORS on
     file://, and double-clicking index.html has to work.
     ═══════════════════════════════════════════════════════════════ -->

<!-- ── core, part 1: no dependencies ──────────────────────────── -->
<script src="js/core/util.js"></script>
<script src="js/core/expr.js"></script>
<script src="js/core/draw.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/fx.js"></script>

<!-- ── the tier toggle, before anything that filters on it ────── -->
<script src="js/data/tiers.js"></script>

<!-- ── core, part 2 ───────────────────────────────────────────── -->
<script src="js/core/state.js"></script>
<script src="js/core/bank.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/arcade.js"></script>

<!-- ── content: Advanced ──────────────────────────────────────── -->
<script src="js/data/questions-ma-functions.js"></script>
<script src="js/data/questions-ma-trig.js"></script>
<script src="js/data/questions-ma-calculus.js"></script>
<script src="js/data/questions-ma-integration.js"></script>
<script src="js/data/questions-ma-financial.js"></script>
<script src="js/data/questions-ma-statistics.js"></script>
<script src="js/data/questions-ma-mixed.js"></script>

<!-- ── content: Extension 1.
     REMOVE these six lines (and their PRECACHE entries in sw.js) for an
     Advanced-only build, and set MQ.DATA.TIERS = ["MA"] in tiers.js. ─────── -->
<script src="js/data/questions-me-functions.js"></script>
<script src="js/data/questions-me-trig.js"></script>
<script src="js/data/questions-me-calculus.js"></script>
<script src="js/data/questions-me-discrete.js"></script>
<script src="js/data/questions-me-vectors.js"></script>

<!-- ── shared content ─────────────────────────────────────────── -->
<script src="js/data/generators.js"></script>
<script src="js/data/flashcards.js"></script>
<script src="js/data/proofs.js"></script>
<script src="js/data/reference.js"></script>
<script src="js/data/shop.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/data/arcade.js"></script>

<!-- ── games ──────────────────────────────────────────────────── -->
<script src="js/games/quiz.js"></script>
<script src="js/games/equiv.js"></script>
<script src="js/games/match.js"></script>
<script src="js/games/curve.js"></script>
<script src="js/games/crunch.js"></script>
<script src="js/games/panic.js"></script>
<script src="js/games/lab.js"></script>
<script src="js/games/proof.js"></script>
<script src="js/games/vector.js"></script>
<script src="js/games/survival.js"></script>
<script src="js/games/boss.js"></script>
<script src="js/games/arcade-crush.js"></script>
<script src="js/games/arcade-runner.js"></script>
<script src="js/games/arcade-tower.js"></script>

<!-- ── screens ────────────────────────────────────────────────── -->
<script src="js/screens/home.js"></script>
<script src="js/screens/play.js"></script>
<script src="js/screens/study.js"></script>
<script src="js/screens/reference.js"></script>
<script src="js/screens/progress.js"></script>
<script src="js/screens/shop.js"></script>
<script src="js/screens/misc.js"></script>

<script src="js/app.js"></script>
</body>
</html>
